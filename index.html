<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Vaultoria</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
        }
        .play-button {
            display: inline-block;
            padding: 15px 30px;
            font-size: 1.25rem;
            font-weight: bold;
            color: #121212;
            background-color: #00ffcc;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }
        .play-button:hover {
            background-color: #00ccaa;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome to Vaultoria</h1>
        <p>Ready to hoard, trade, and rule?</p>
        <a class="play-button" href="https://vaultoriaplay.onrender.com">Click here to play the game</a>
    </div>

</body>
</html>
